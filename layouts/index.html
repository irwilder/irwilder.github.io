{{- define "main" }}

  {{/* Render the profile block — photo, name, subtitle, social icons */}}
  {{- partial "index_profile.html" . }}

  {{/* Render the body content from content/_index.md */}}
  {{- if .Content }}
  <div class="post-content" style="max-width: 800px; margin: 0.2rem auto; padding: 0 1rem;">
    {{ .Content }}
  </div>
  {{- end }}

{{- end }}
